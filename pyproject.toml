[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "smallAntibodyGen"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    # Parquet engine for `scripts/prepare_antibody_antigen.py`, which reads the
    # ASD shards through `pandas.read_parquet`. Never imported by name, so no
    # import scan finds it -- it was an undeclared transitive requirement until
    # the Gate-0 review, and its absence made 11 tests skip silently while the
    # suite still reported green (found in the local Gate-0 review).
    "pyarrow>=14.0",
    "PyYAML>=6.0",
    # Ranking for `evaluation/paired_antigen.py` (`scipy.stats.rankdata`), which
    # feeds both the Spearman statistic and the permutation null. The same bug
    # class as pyarrow above, and it was masked the same way: scipy is currently
    # present only as a TRANSITIVE dependency of the optional `esm-if1` extra
    # (biotite -> biotraj -> scipy), so a base `pip install -e ".[dev]"` has no
    # scipy at all. The import is lazy, inside the functions, so the module still
    # imports cleanly and the break surfaces only when the evaluator is CALLED --
    # verified on a scipy-less interpreter: import succeeds, `_spearman` raises
    # ModuleNotFoundError. Not reimplemented in numpy because bootstrap resampling
    # repeats observations, so the tie convention is load-bearing and a hand-rolled
    # rank would need its own numerical proof.
    "scipy>=1.10",
    "tabulate>=0.9",
    "torch>=2.1",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# Direction 1 (hybrid PLM antigen encoder). Only needed when
# antigen_encoder_type="esm"; imported lazily so the base install and the
# from-scratch stages never require these.
esm = [
    "transformers>=4.40",
    "peft>=0.11",
]
# HER2 post-training on the pinned p-IgGen release. `transformers` supplies the
# native GPTNeoX classes and `safetensors` loads the released weights; both are
# imported lazily inside `experiments/her2_policy.py`, so the data, metric and
# preference layers work without them and their tests skip rather than fail.
# The .xlsx assay workbook is read with the standard library, so no openpyxl.
her2 = [
    # The shared-prefix path uses GPTNeoX's mutable DynamicCache API. Pin the
    # release exercised by the native GPU and gradient-parity checks.
    "transformers==5.12.1",
    "safetensors>=0.4",
]
# Optional TensorBoard scalar logging (enabled per-run with `tensorboard: true`).
# Imported lazily so the base install and non-logging runs never require it.
tb = [
    "tensorboard>=2.14",
]
# ESM-IF1 backbone (Decision 0003, 2026-09-14). Imported lazily; nothing in the
# custom-model chain needs these.
#
# `torch-scatter` is deliberately ABSENT despite being a real upstream import of
# `esm.inverse_folding`: PyPI ships 2.1.2 as an sdist only, with no wheel for any
# platform, and building it needs an MSVC newer than the training box has.
# `smallAntibodyGen.esmif1_compat` substitutes the one function ESM calls. Adding
# torch-scatter here would make this extra uninstallable on the training box.
esm-if1 = [
    "fair-esm>=2.0.0",
    "torch-geometric>=2.3",
    "biotite>=1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
