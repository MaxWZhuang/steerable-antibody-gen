name: guardrails

# The local-only guardrail used to live only in .git/hooks/pre-commit, which git
# does not version and `git clone` does not copy -- so it protected exactly one
# working copy. This runs the same policy where it cannot be skipped.
#
# Deliberately narrow: it checks that nothing internal has been committed and
# that the test suite passes. It does not train anything.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  local-only-files:
    name: no internal files in the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # No dependencies: the guardrail is stdlib-only on purpose, so it still
      # runs when an install fails. A guardrail that needs a working install is
      # unavailable exactly when things are broken.
      - name: Audit the committed tree
        run: python scripts/check_local_only_files.py --ref HEAD

  tests:
    name: test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        # CPU-only torch: the default PyPI wheel is the CUDA build, ~2.5 GB to
        # download and unpack on a runner that has no GPU. Every GPU-dependent
        # test here already runs on CPU or skips, so the CUDA build buys nothing
        # and cost ~6 minutes on the first run.
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest src/smallAntibodyGen/tests -q
