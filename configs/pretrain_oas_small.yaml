# Stage 1/4 — base MLM pretraining on unpaired OAS (~3M heavy+light).
# Chain: THIS -> refine_oas_paired -> refine_antigen_real_label -> refine_antigen_hcdr3_infill
# Produces checkpoints/mlm_3m_unpaired_v5/best.pt, consumed by stage 2's init_checkpoint.
#
# v4 -> v5: TWO architecture changes, and both invalidate every earlier checkpoint.
#   (a) max_length 192 -> 288 (Open Decision 1; see the note at max_length below).
#   (b) the modern block -- RoPE, pre-RMSNorm, SwiGLU at 680, no attention/FFN biases --
#       adopted 2026-08-29. The recipe is an owner decision; the WIDTH is J11's measured
#       result (specs/experiments/j11_swiglu_width.md section 8).
# NO v5 artifact has ever been trained -- `ls checkpoints/` has no *_v5 directory -- so this
# edit mixes nothing. The v5 generation is DEFINED by these configs, not migrated into them.
# The moment a v5 checkpoint exists, any further architecture change costs a v6.
# v3 -> v4: norm_first: true (pre-LN). This is an architecture change, so the whole chain
# retrains from scratch and NO v3 checkpoint may be warm-started, evaluated, or compared
# against a v4 one. The v3 dirs are left on disk untouched; treat them as a separate,
# closed generation. Every v3 metric is dead — re-measure floors on v4 before any claim.
# The init-compat check enforces the boundary (it reads a missing norm_first key as post-LN),
# which matters because single-stream pre-LN and post-LN state dicts are name- and
# shape-identical: strict=True loads one into the other without complaint.
#
# resume_from_last: safe here because this is a fresh v4 dir. WARNING: if you edit
# hyperparameters and relaunch into a populated dir, resume silently reloads last.pt and
# IGNORES your edits (and init_checkpoint). Delete last.pt (or set false) on an intentional
# config change. (filename is historical — this is the full 3M run, not a "small" one.)
training_stage: base
data_path: data/processed/oas_unpaired_3m/oas_all.jsonl.gz
output_dir: checkpoints/mlm_3m_unpaired_v5
resume_from_last: true

seed: 42
batch_size: 16
eval_batch_size: 16
train_num_workers: 0
eval_num_workers: 0
# v4 -> v5: 192 -> 288 (Open Decision 1, resolved 2026-08-27). 192 truncated 100.00% of
# paired-OAS train rows and destroyed CDR-L3 on 99.96% of them, and 75.86% of the
# antibody-antigen rows. 288 clears BOTH corpora outright -- measured maxima are 281 (paired,
# 2,513,626 rows) and 258 (antibody-antigen, 828,315 rows) -- so no row is truncated at all.
# 256 was rejected: it still overflows 452 paired and 2 antigen rows.
# Evidence: the local (untracked) J04 context-census reports under outputs/.
max_length: 288
bucket_width: 8

mask_probability: 0.15
hcdr3_span_probability: 0.4
hcdr3_span_min: 3
hcdr3_span_max: 8
shuffle_pair_probability: 0.0
pair_loss_weight: 0.0

learning_rate: 0.0003
warmup_steps: 1000        # NEW vs prior run: linear LR warmup, guards from-scratch early divergence.
weight_decay: 0.01
grad_clip_norm: 1.0
epochs: 3            # was 10. best.pt is val-selected (mlm_train.py:2847), so this is a
                    # compute ceiling, not a quality knob; MLM over ~3M rows saturates in
                    # 2-3 passes. This stage dominates wall-clock on a single small GPU.

d_model: 256
n_heads: 8
n_layers: 6
d_ff: 1024
dropout: 0.1
norm_first: true    # v4: pre-LN. Was post-LN (the PyTorch default, never a deliberate
                    # choice) through v3. At 6 layers post-LN trains fine, so do not expect
                    # a large quality delta; the gain is a clean identity residual path and
                    # less dependence on warmup to avoid early divergence. MUST be identical
                    # across all four stages — the init-compat check rejects a mismatch.
# ---- canonical modern block (v5) -------------------------------------------
# Adopted 2026-08-29. The block recipe (RoPE, pre-RMSNorm, SwiGLU, no biases) is
# an owner decision; the WIDTH is J11's measured result -- see
# specs/experiments/j11_swiglu_width.md section 8 and the machine report
# specs/evidence/j11-comparison.json (selected_width: 680).
#
# 1024 lost: +0.306 pp mean HCDR3 token recovery across 3/3 paired seeds against
# a +1.0 pp bar, for 18.7% more step time and 33.6% more parameters. That is a
# practical negative at this budget, NOT a demonstration that capacity cannot
# help after full training.
#
# These seven values MUST be identical across stages 1-4 and the stage-4 ESM
# ablation. Each stage warm-starts from the previous best.pt, so a difference is
# a warm start across an architecture boundary -- caught by strict=True and the
# fingerprint check, but only after the previous stage has finished training.
# Pinned by src/smallAntibodyGen/tests/test_v5_chain_block.py.
position_encoding: rope    # no learned position table at all
norm_type: rmsnorm         # placement (norm_first) and operator are INDEPENDENT knobs
ffn_type: swiglu
attention_bias: false
ffn_bias: false
# Explicit, never inferred from d_ff: accidental capacity is precisely what J11
# measured the cost of.
swiglu_hidden_dim: 680
# ----------------------------------------------------------------------------

# MEASURED 2026-08-29, one axis, this config, modern block, batch 16:
#   use_amp: false    54.8 ms/step   360 MiB   (val 38.4 ms/batch)
#   use_amp: true    149.5 ms/step   282 MiB   (val 75.6 ms/batch)
# AMP is 2.73x SLOWER here, so this stage costs ~8.2 h instead of ~22.2 h. The
# GTX 1650 SUPER is Turing TU116: compute capability 7.5 but NO Tensor Cores, so
# fp16 autocast pays cast overhead and buys no matmul speedup. Replicated at
# stage 2 (2.86x, batch 32), so it is the hardware, not this config.
#
# fp32 is also the more accurate regime: no GradScaler, so no skipped optimizer
# steps -- the very thing that made J11's criterion 7 unauditable.
#
# AMP is a MEMORY tool on this card, not a speed one. It stays ON for stages 3-4,
# where it is REQUIRED: dual-stream 288/1024 batch 16 measures 2390 MiB reserved
# with AMP and 3316 MiB without, i.e. 41.6% vs 19.0% headroom against the 25%
# floor. Do not propagate this flip to those stages -- see their own use_amp notes.
#
# On a Tensor Core card the speed trade reverses. Re-measure; do not assume.
use_amp: false
show_progress: true
device: cuda
