# J11 arm B -- canonical modern block at SwiGLU width 1024.
#
# PAIRED with arm_680.yaml. The two files differ in EXACTLY swiglu_hidden_dim and
# output_dir; everything else is identical on purpose. J11 asks whether ~33.6% more
# capacity buys a practical CDR3 benefit, so anything else differing would answer a
# different question.
#
# DO NOT RUN YET. Blocked on (a) the budget question in
# specs/experiments/j11_swiglu_width.md 4.1 -- the 36 GPU-hour budget clears the
# 50,000-update floor only at near-zero real-loop overhead -- and (b) a durable remote
# reference, which the owner requires before the six evidence runs.
#
# Architecture is the canonical modern block adopted 2026-08-28: RoPE, pre-RMSNorm,
# SwiGLU, no attention/FFN biases. It is spelled out here rather than inherited, because
# a bakeoff config that silently tracks a default is a bakeoff whose arms can change
# under it.
#
# Parameters: 6,304,258 (+30.7% vs the 4,822,530 legacy model).
# Measured step time: 446.89 ms median at batch 16 with AMP.
#
# PAIRING IS NOT AUTOMATIC. The wider arm's feed-forward consumes more init RNG, so
# every parameter built after it would differ. The runner must call
# experiments.init_parity.reinitialize_by_module_name(model, config, seed) and then
# reset_training_rng(seed) before the first step, or three seeds are six unrelated runs
# rather than three paired observations.

training_stage: base
data_path: data/processed/oas_unpaired_3m/oas_all.jsonl.gz
output_dir: checkpoints/experiments/j11_swiglu1024_seed42
resume_from_last: false        # a pilot arm is never resumed; rerun it clean

# One of the three frozen seeds: 42, 31415, 271828.
seed: 42

# Frozen budget. Batch 16 is not merely the chosen value -- batch 32 does not fit the
# full 288/1024 dual-stream configuration for either modern arm.
batch_size: 16
eval_batch_size: 16
train_num_workers: 0
eval_num_workers: 0

max_length: 288
bucket_width: 8

mask_probability: 0.15
hcdr3_span_probability: 0.0

learning_rate: 0.0003
warmup_steps: 2000
weight_decay: 0.01
grad_clip_norm: 1.0
epochs: 1

d_model: 256
n_heads: 8
n_layers: 6
d_ff: 1024
dropout: 0.1

# ---- canonical modern block -------------------------------------------------
position_encoding: rope        # no learned position table at all
norm_type: rmsnorm
norm_first: true               # placement and operator are INDEPENDENT knobs
ffn_type: swiglu
attention_bias: false
ffn_bias: false
# ---- THE ONLY AXIS UNDER TEST -----------------------------------------------
swiglu_hidden_dim: 1024
# -----------------------------------------------------------------------------

use_amp: true
show_progress: true
device: cuda
