# Stage 3/4 — antigen-conditioned compatibility on REAL binder/non-binder labels.
# Warm-starts antibody encoder + heads from stage 2; the antigen encoder + cross-attention
# fusion + compatibility head are trained here. Produces checkpoints/mlm_antigen_real_label_v5/best.pt.
#
# v4 -> v5: TWO architecture changes, and both invalidate every earlier checkpoint.
#   (a) max_length 192 -> 288 (Open Decision 1; see the note at max_length below).
#   (b) the modern block -- RoPE, pre-RMSNorm, SwiGLU at 680, no attention/FFN biases --
#       adopted 2026-08-29. The recipe is an owner decision; the WIDTH is J11's measured
#       result (specs/experiments/j11_swiglu_width.md section 8).
# NO v5 artifact has ever been trained -- `ls checkpoints/` has no *_v5 directory -- so this
# edit mixes nothing. The v5 generation is DEFINED by these configs, not migrated into them.
# The moment a v5 checkpoint exists, any further architecture change costs a v6.
# v3 -> v4: norm_first: true (pre-LN), matching stages 1-2. In pre-LN mode `fuse` also gains
# terminal fusion_out_norm_* layers (docs/ARCHITECTURE.md 4.3), so this stage's dual-stream
# state dict differs structurally from v3 and a cross-generation load fails strict=True as
# well as the init-compat check. The ~0.54 floor below is a property of the label population,
# not of v3, so it still applies -- but every measured v3 compat number is dead. Re-measure.
#
# Data note: this stage keeps only binder_label in {0,1} == the affinity_type=="bool" rows
# (~59.5k; ~54% positive). That is a smaller, different population than the strong-binder set
# the stage-4 infiller trains on -- expected, but read compat metrics with that in mind.
# Eval note: the group-majority shortcut baseline in mlm_train.py only fires for
# training_stage=="antigen_refine", NOT this stage. Judge compat AUROC/MCC against the ~0.54
# always-positive rate yourself, and watch the "[split] ... overlap" line for target leakage.
training_stage: antigen_real_label_refine
data_path: data/processed/antibody_antigen/antibody_antigen.jsonl.gz
init_checkpoint: checkpoints/mlm_paired_refine_v5/best.pt
output_dir: checkpoints/mlm_antigen_real_label_v5
resume_from_last: true

seed: 42
batch_size: 16
eval_batch_size: 16
train_num_workers: 0
eval_num_workers: 0
# v4 -> v5: 192 -> 288 (Open Decision 1, resolved 2026-08-27). 192 truncated 100.00% of
# paired-OAS train rows and destroyed CDR-L3 on 99.96% of them, and 75.86% of the
# antibody-antigen rows. 288 clears BOTH corpora outright -- measured maxima are 281 (paired,
# 2,513,626 rows) and 258 (antibody-antigen, 828,315 rows) -- so no row is truncated at all.
# 256 was rejected: it still overflows 452 paired and 2 antigen rows.
# Evidence: the local (untracked) J04 context-census reports under outputs/.
max_length: 288

# Antigen stream token budget, INCLUDING [CLS]/[EOS] (Open Decision 1, resolved 2026-08-27).
# Inert before AB-07 was fixed: the antigen encoder was built from the same config as the
# antibody encoder and silently inherited max_length, truncating 87.31% of train rows with a
# worst overflow of +1850 tokens. 1024 covers 99.31% of train and 96.42% of val antigens
# (measured p50 610 / max 2042) and costs 1842 MiB of 4096 at batch 16 with AMP -- ~55%
# headroom. 2048 removes the final tail but leaves only ~23-25% worst-case headroom, exposes
# quadratic antigen self-attention, and lets one long antigen expand its locally padded batch;
# it is deferred to a targeted run if the per-target breakdown shows the >1024 tail matters.
antigen_max_length: 1024
bucket_width: 8

mask_probability: 0.10
hcdr3_span_probability: 0.0
hcdr3_span_min: 3
hcdr3_span_max: 8
# Which rows contribute ANTIGEN-CONDITIONED MLM targets. Stage 3 restricts this to
# measured binders: a measured NONBINDER must not become a positive reconstruction
# target under the antigen it is labeled not to bind. Nonbinders still contribute
# class-0 compatibility supervision, and their corrupted input is unchanged.
#
# Set explicitly rather than left to the stage default, because the two policies
# produce different training populations from otherwise identical-looking configs.
# Stage-3 MLM loss is NOT comparable across this setting -- re-baseline rather than
# compare, and treat any regression budget defined against a pre-change number as
# void. Resume against a populated output dir is unsafe until run fingerprinting
# can reject the mismatch (J03); use a fresh output dir or --no-resume-from-last.
#
# Contract:  specs/conditional_denoising_eligibility.md
# Rationale: specs/decisions/0001-conditional-denoising-eligibility.md
conditional_denoising_eligibility: binary_binders_only

hcdr3_mask_mode: sampled_span
mask_replacement_strategy: bert
shuffle_pair_probability: 0.0
shuffle_antigen_probability: 0.0

learning_rate: 0.00005
warmup_steps: 300
weight_decay: 0.01
grad_clip_norm: 1.0
pair_loss_weight: 0.0
compatibility_loss_weight: 1.0
epochs: 12

d_model: 256
n_heads: 8
n_layers: 6
d_ff: 1024
dropout: 0.1
norm_first: true    # v4: pre-LN. Must match stage 2 exactly or init-compat rejects the warm start.
# ---- canonical modern block (v5) -------------------------------------------
# Adopted 2026-08-29. The block recipe (RoPE, pre-RMSNorm, SwiGLU, no biases) is
# an owner decision; the WIDTH is J11's measured result -- see
# specs/experiments/j11_swiglu_width.md section 8 and the machine report
# specs/evidence/j11-comparison.json (selected_width: 680).
#
# 1024 lost: +0.306 pp mean HCDR3 token recovery across 3/3 paired seeds against
# a +1.0 pp bar, for 18.7% more step time and 33.6% more parameters. That is a
# practical negative at this budget, NOT a demonstration that capacity cannot
# help after full training.
#
# These seven values MUST be identical across stages 1-4 and the stage-4 ESM
# ablation. Each stage warm-starts from the previous best.pt, so a difference is
# a warm start across an architecture boundary -- caught by strict=True and the
# fingerprint check, but only after the previous stage has finished training.
# Pinned by src/smallAntibodyGen/tests/test_v5_chain_block.py.
position_encoding: rope    # no learned position table at all
norm_type: rmsnorm         # placement (norm_first) and operator are INDEPENDENT knobs
ffn_type: swiglu
attention_bias: false
ffn_bias: false
# Explicit, never inferred from d_ff: accidental capacity is precisely what J11
# measured the cost of.
swiglu_hidden_dim: 680
# ----------------------------------------------------------------------------

# Antigen stream = from-scratch transformer. NOTE: the scratch antigen encoder truncates the
# antigen to antigen_max_length (1024) tokens -- its OWN budget since AB-07, no longer the
# antibody max_length. At 1024, 0.69% of training and 3.58% of validation antigens are still
# truncated (measured p50 610 / max 2042); 2048 would reach 0% but see the header note on
# headroom. The ESM variant uses the SAME 1024 so the arms differ on one axis.
use_amp: true
show_progress: true
device: cuda
