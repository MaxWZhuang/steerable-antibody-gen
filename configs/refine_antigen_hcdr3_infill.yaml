# Stage 4/4 — antigen-conditioned, fixed-length HCDR3 infilling (from-scratch antigen stream).
# Warm-starts from stage 3. Trains on the full is_strong_binder population (~216.6k train /
# 1.78k val) -- positive-only conditional residue model, not a binder classifier.
# Produces checkpoints/mlm_antigen_hcdr3_infill_v4/best.pt.
#
# v3 -> v4: norm_first: true (pre-LN), matching stages 1-3. Generation and scoring must use a
# v4 checkpoint: hcdr3_infill.py's DEFAULT_SCORE_CHECKPOINT was moved to the v4 stage-3 dir in
# the same commit. Mixing a v4 infiller with a v3 scorer is a cross-generation error.
#
# Watch these metrics (logged as val_hcdr3_*): hcdr3_token_acc and hcdr3_span_exact_match.
# When ranking generated candidates across proposed lengths, use mean_log_probability, not
# the raw log-probability sum (raw sum grows with length).
training_stage: antigen_hcdr3_infill_refine
data_path: data/processed/antibody_antigen/antibody_antigen.jsonl.gz
init_checkpoint: checkpoints/mlm_antigen_real_label_v4/best.pt
output_dir: checkpoints/mlm_antigen_hcdr3_infill_v4
resume_from_last: true

seed: 42
batch_size: 16
eval_batch_size: 16
train_num_workers: 0
eval_num_workers: 0
max_length: 192
bucket_width: 8

mask_probability: 0.10
hcdr3_span_probability: 1.0
hcdr3_span_min: 3
hcdr3_span_max: 8
# Which rows contribute ANTIGEN-CONDITIONED MLM targets. Stage 4 uses
# `all_filtered_rows`: it filters on `is_strong_binder`, which is deliberately
# broader than `binder_label` (populated only for `affinity_type == "bool"` rows),
# so restricting to `binder_label == 1` here would silently drop the large
# majority of strong binders while the loss curve stayed plausible.
#
# Stated explicitly rather than left to the default, so a reader of this config
# can see which population the stage denoises.
#
# Contract:  specs/conditional_denoising_eligibility.md
# Rationale: specs/decisions/0001-conditional-denoising-eligibility.md
conditional_denoising_eligibility: all_filtered_rows

hcdr3_mask_mode: full_span
mask_replacement_strategy: always_mask
shuffle_pair_probability: 0.0
shuffle_antigen_probability: 0.0

learning_rate: 0.00003
warmup_steps: 200
weight_decay: 0.01
grad_clip_norm: 1.0
pair_loss_weight: 0.0
compatibility_loss_weight: 0.0
epochs: 8

d_model: 256
n_heads: 8
n_layers: 6
d_ff: 1024
dropout: 0.1
norm_first: true    # v4: pre-LN. Must match stage 3 exactly or init-compat rejects the warm start.

use_amp: true
show_progress: true
device: cuda
