# Stage 2/4 — paired VH/VL refinement. Warm-starts from the stage-1 base model.
# Produces checkpoints/mlm_paired_refine_v5/best.pt, consumed by stage 3's init_checkpoint.
# This is BY FAR the largest compute item in the chain (45 epochs over ~1.8M paired rows);
# best.pt is checkpointed on val loss, but all 45 epochs run (no early stopping).
#
# v4 -> v5: TWO architecture changes, and both invalidate every earlier checkpoint.
#   (a) max_length 192 -> 288 (Open Decision 1; see the note at max_length below).
#   (b) the modern block -- RoPE, pre-RMSNorm, SwiGLU at 680, no attention/FFN biases --
#       adopted 2026-08-29. The recipe is an owner decision; the WIDTH is J11's measured
#       result (specs/experiments/j11_swiglu_width.md section 8).
# NO v5 artifact has ever been trained -- `ls checkpoints/` has no *_v5 directory -- so this
# edit mixes nothing. The v5 generation is DEFINED by these configs, not migrated into them.
# The moment a v5 checkpoint exists, any further architecture change costs a v6.
# v3 -> v4: norm_first: true (pre-LN), matching stage 1. Never warm-start this from a v3
# checkpoint — see the generation note in configs/pretrain_oas_small.yaml.
training_stage: paired_refine
data_path: data/processed/oas_paired_all/oas_paired.jsonl.gz
init_checkpoint: checkpoints/mlm_3m_unpaired_v5/best.pt
output_dir: checkpoints/mlm_paired_refine_v5
resume_from_last: true

seed: 42
batch_size: 32
eval_batch_size: 32
train_num_workers: 0
eval_num_workers: 0
# v4 -> v5: 192 -> 288 (Open Decision 1, resolved 2026-08-27). 192 truncated 100.00% of
# paired-OAS train rows and destroyed CDR-L3 on 99.96% of them, and 75.86% of the
# antibody-antigen rows. 288 clears BOTH corpora outright -- measured maxima are 281 (paired,
# 2,513,626 rows) and 258 (antibody-antigen, 828,315 rows) -- so no row is truncated at all.
# 256 was rejected: it still overflows 452 paired and 2 antigen rows.
# Evidence: the local (untracked) J04 context-census reports under outputs/.
max_length: 288
bucket_width: 8

mask_probability: 0.15
hcdr3_span_probability: 0.1
hcdr3_span_min: 3
hcdr3_span_max: 8
shuffle_pair_probability: 0.5
pair_loss_weight: 0.5

learning_rate: 0.0001
warmup_steps: 500         # NEW vs prior run.
weight_decay: 0.01
grad_clip_norm: 1.0
epochs: 8             # was 45. Warm-start refine at lr 1e-4; best.pt (val-selected) plateaus
                     # well before 8 epochs, so 45 was ~5x wasted compute with no early stop.

d_model: 256
n_heads: 8
n_layers: 6
d_ff: 1024                # FIX: old example said 512, which fails the init-compat check against the 1024 base.
dropout: 0.1
norm_first: true          # v4: pre-LN. Must match stage 1 exactly or init-compat rejects the warm start.
# ---- canonical modern block (v5) -------------------------------------------
# Adopted 2026-08-29. The block recipe (RoPE, pre-RMSNorm, SwiGLU, no biases) is
# an owner decision; the WIDTH is J11's measured result -- see
# specs/experiments/j11_swiglu_width.md section 8 and the machine report
# specs/evidence/j11-comparison.json (selected_width: 680).
#
# 1024 lost: +0.306 pp mean HCDR3 token recovery across 3/3 paired seeds against
# a +1.0 pp bar, for 18.7% more step time and 33.6% more parameters. That is a
# practical negative at this budget, NOT a demonstration that capacity cannot
# help after full training.
#
# These seven values MUST be identical across stages 1-4 and the stage-4 ESM
# ablation. Each stage warm-starts from the previous best.pt, so a difference is
# a warm start across an architecture boundary -- caught by strict=True and the
# fingerprint check, but only after the previous stage has finished training.
# Pinned by src/smallAntibodyGen/tests/test_v5_chain_block.py.
position_encoding: rope    # no learned position table at all
norm_type: rmsnorm         # placement (norm_first) and operator are INDEPENDENT knobs
ffn_type: swiglu
attention_bias: false
ffn_bias: false
# Explicit, never inferred from d_ff: accidental capacity is precisely what J11
# measured the cost of.
swiglu_hidden_dim: 680
# ----------------------------------------------------------------------------

# Deliberately NOT changed to the batch-16 + AMP envelope of Open Decision 1. That envelope
# was chosen for the ANTIGEN stages, where the second encoder dominates memory; this stage has
# no antigen stream. Measured on the GTX 1650 SUPER at the new max_length: 288 with batch 32
# and AMP off peaks at 1200 MiB of 4096 (29%), against 834 MiB at the old 192 -- so the known-
# good setting still fits with room to spare and is kept rather than perturbed alongside the
# context change. One axis at a time.
# MEASURED 2026-08-29, one axis, this config, modern block, batch 32:
#   use_amp: false   235.9 ms/step   1430 MiB reserved
#   use_amp: true    674.0 ms/step    818 MiB reserved
# AMP is 2.9x SLOWER here. An earlier version of this line read "Flip to true for
# speed if stable" -- that advice was backwards on this card and is why it is
# replaced with the measurement rather than reworded. The GTX 1650 SUPER is
# Turing TU116: compute capability 7.5 but NO Tensor Cores, so fp16 autocast pays
# cast overhead and buys no matmul speedup. AMP here is a MEMORY tool, not a speed
# one -- and memory is not the constraint at this stage (65% headroom at AMP off).
# Do not flip this for speed on this hardware. On a Tensor Core card the trade
# reverses and this must be re-measured, not assumed.
use_amp: false            # matches the known-good prior paired run, and is the FASTER setting.
show_progress: true
device: cuda
