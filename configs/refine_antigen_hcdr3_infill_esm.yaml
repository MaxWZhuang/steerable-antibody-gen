# Stage 4 ABLATION — same objective/data as refine_antigen_hcdr3_infill.yaml, but the antigen
# stream is a frozen pretrained ESM-2 8M encoder (Direction 1) instead of the from-scratch
# transformer. Warm-starts the antibody encoder + fusion + heads from the SAME stage-3
# checkpoint as the scratch run; the ESM backbone stays frozen and only the projection /
# cross-attention / heads train. Run this IN PARALLEL with the scratch stage 4 (same init),
# not after it, then compare HCDR3 metrics to make the Stage-B (LoRA) GO/NO-GO call.
#
# Requires the optional extra: pip install -e ".[esm]"  (transformers + peft), plus network
# access (or a pre-populated HF cache / HF_HOME) to fetch esm2_t6_8M weights at model build.
# v5: the CONTEXT-LENGTH confound is removed -- both arms now see the antigen at 1024 tokens,
# where before AB-07 the scratch stream was pinned to the antibody max_length (192) against
# ESM's 512. That is one confound, not the only one.
#
# THIS CONFIG CANNOT RUN AS WRITTEN, AND THAT IS DELIBERATE. It warm-starts from the SCRATCH
# stage-3 checkpoint, so it would inherit fusion and head weights trained on scratch antigen
# features and then swap the encoder underneath them -- the ESM arm would be measured through
# a fusion fitted to its competitor. The plan's J24 says so explicitly: 'do not copy a
# fusion/head trained on scratch features into the ESM arm', and requires BOTH arms to start
# from the same stage-2 antibody checkpoint. The warm-start gate now enforces this: swapping
# antigen_encoder_type on a parent that already has a trained antigen stream is rejected.
#
# Keep this file as the record of the stage-4 ESM ablation's shape; the encoder COMPARISON
# belongs to J24 (not started), rooted at stage 2, with fresh fusion/heads in both arms.
# Memory is not the obstacle: ESM at 288/1024 batch 16 measures 816 MiB against scratch's
# 1842 MiB, because the frozen backbone stores no gradients (outputs/gpu-memory-probe-esm.json).
#
# v3 -> v4: norm_first: true, tracking the scratch stage 4 so the ablation keeps its shared
# init and its single varied axis (antigen encoder). norm_first must stay IDENTICAL to the
# scratch arm or the comparison gains a second confound. Here it governs the antibody encoder
# and the fusion block only -- the antigen stream is ESM, which brings its own architecture.
training_stage: antigen_hcdr3_infill_refine
data_path: data/processed/antibody_antigen/antibody_antigen.jsonl.gz
init_checkpoint: checkpoints/mlm_antigen_real_label_v5/best.pt
output_dir: checkpoints/mlm_antigen_hcdr3_infill_esm_v5
resume_from_last: true

seed: 42
batch_size: 16
eval_batch_size: 16
train_num_workers: 0
eval_num_workers: 0
# v4 -> v5: 192 -> 288 (Open Decision 1, resolved 2026-08-27). 192 truncated 100.00% of
# paired-OAS train rows and destroyed CDR-L3 on 99.96% of them, and 75.86% of the
# antibody-antigen rows. 288 clears BOTH corpora outright -- measured maxima are 281 (paired,
# 2,513,626 rows) and 258 (antibody-antigen, 828,315 rows) -- so no row is truncated at all.
# 256 was rejected: it still overflows 452 paired and 2 antigen rows.
# Evidence: the local (untracked) J04 context-census reports under outputs/.
max_length: 288
bucket_width: 8

mask_probability: 0.10
hcdr3_span_probability: 1.0
hcdr3_span_min: 3
hcdr3_span_max: 8
# Which rows contribute ANTIGEN-CONDITIONED MLM targets. Stage 4 uses
# `all_filtered_rows`: it filters on `is_strong_binder`, which is deliberately
# broader than `binder_label` (populated only for `affinity_type == "bool"` rows),
# so restricting to `binder_label == 1` here would silently drop the large
# majority of strong binders while the loss curve stayed plausible.
#
# Stated explicitly rather than left to the default, so a reader of this config
# can see which population the stage denoises.
#
# Contract:  specs/conditional_denoising_eligibility.md
# Rationale: specs/decisions/0001-conditional-denoising-eligibility.md
conditional_denoising_eligibility: all_filtered_rows

hcdr3_mask_mode: full_span
mask_replacement_strategy: always_mask
shuffle_pair_probability: 0.0
shuffle_antigen_probability: 0.0

learning_rate: 0.00003
warmup_steps: 200
weight_decay: 0.01
grad_clip_norm: 1.0
pair_loss_weight: 0.0
compatibility_loss_weight: 0.0
epochs: 8

d_model: 256
n_heads: 8
n_layers: 6
d_ff: 1024
dropout: 0.1
norm_first: true    # v4: pre-LN. MUST equal the scratch stage-4 value (one-axis rule).

antigen_encoder:
  type: esm
  esm_model_name: facebook/esm2_t6_8M_UR50D
  # v5: 512 -> 1024, MATCHING the scratch stage-4 value. This REMOVES the
  # context-length confound the v3/v4 header declared (ESM 512 vs scratch 192):
  # the scratch antigen stream could not exceed the antibody max_length until
  # AB-07 was fixed, so the two arms necessarily differed on two axes. They now
  # differ on exactly one -- the antigen encoder -- which is what Rule 3 requires.
  antigen_max_length: 1024
  finetune: frozen

use_amp: true
show_progress: true
device: cuda
